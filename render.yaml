services:
  # Backend FastAPI Service
  - type: web
    name: simple-todo-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn main:server -k uvicorn.workers.UvicornWorker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: simple-todo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false # Set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://simple-todo-frontend.onrender.com # Change this after frontend is deployed

  # Frontend React Static Site
  - type: web
    name: simple-todo-frontend
    env: static
    buildCommand: cd frontend/simple_todo && npm install && npm run build
    staticPublishPath: frontend/simple_todo/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: simple-todo-backend
          property: host

databases:
  - name: simple-todo-db
    plan: free
